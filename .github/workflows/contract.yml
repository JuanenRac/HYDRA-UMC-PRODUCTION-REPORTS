name: DATALAKE contract

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: Chain tests against the real DATALAKE
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Check out DATALAKE
        uses: actions/checkout@v5
        with:
          repository: JuanenRac/HYDRA-UMC-DATALAKE
          path: datalake
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install this package
        run: python -m pip install -e ".[dev]"
      - name: Run the chain tests with the real DATALAKE
        env:
          HYDRA_UMC_DATALAKE_ROOT: ${{ github.workspace }}/datalake
        run: python -m pytest tests/test_real_telemetry_to_report_chain.py -q -rs
